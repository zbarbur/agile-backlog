description: 'Users (and AI agents) confuse edit and move commands. edit is for field
  changes (title, specs, criteria), move is for status transitions (backlog/doing/done).
  Key issues: (1) edit does not have --status flag but users try to use it, (2) batch
  operations (multiple IDs) are supported by both commands but not documented prominently,
  (3) the distinction between scoping (sprint-start) and speccing (pre-execution)
  is not clear from CLI help alone. Suggested improvements: add a ''Command Reference''
  section to README with a comparison table, update --help text to cross-reference
  the other command, mention batch ID support in --help.'
