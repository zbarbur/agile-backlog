description: Without --force, install-skills prints 'Installed N skill(s)' AND exits
  1 when any skill already exists. Success message + failure code is contradictory.
  Found dogfooding on storybook.
acceptance_criteria:
- A second install run (everything skipped) exits 0 with a skipped summary; --force
  overwrites and exits 0
- Only the genuine error path (bundled skills not found) exits non-zero
- Regression tests assert result.exit_code == 0 on the skip and force paths
- Tests pass; lint clean
test_plan:
- 'tests/test_cli.py: skip path exit 0, force exit 0, no-op rerun exit 0 with Skipped
