description: See docs/design/SPRINT30_DASHBOARD_V2_DESIGN.md Section 3 for full acceptance
  criteria, technical specs, and dependencies. This item is one of 5 produced by the
  Sprint 30 design session.
acceptance_criteria:
- Context view renders tabs Overview (current flat content moved intact) + Tools +
  Categories + Re-reads, default Overview
- 'Tools tab: sortable table Tool/Calls/Total tokens/Percent with click-to-expand
  per-target drilldown and a context_budget_check prompt_button'
- 'Categories tab: four rows Reads/Writes/Search/Execution with tokens, calls, percentage
  bar from a pure mapping constant'
- 'Re-reads tab: files read more than 3 times sorted desc with count, reread tokens,
  and a re_read_waste_fix prompt_button; empty state when none'
- All ui.html content safe_html-wrapped; tabs consume existing parsed entries (no
  new log parsing); tests pass; lint clean
test_plan:
- 'tests/test_pure.py: categorize_tools four-category sums/percentages and unknown-tool
  handling; compute_reread_waste threshold filter, descending sort, empty case'
- 'tests/test_context_report.py: tool_category_breakdown over a multi-tool fixture
  matches estimate_tool_tokens + analyze_tool_usage'
notes: "Depends on native-transcript-ingestion (entry schema must stay drop-in) and\
  \ prompt-registry (prompt_button). No NiceGUI render-test harness exists, so push\
  \ all logic into pure.py/context_report.py and keep the renderer a thin untested\
  \ shell. Token figures are estimates \u2014 keep the ~ prefix."
