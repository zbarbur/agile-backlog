acceptance_criteria:
- Clicking a skill row expands to show full SKILL.md content
- Edit button opens inline editor for skill frontmatter and body
- Validate button runs quality check (description length, trigger keywords, USE THIS/DO
  NOT patterns)
- Quality score displayed per skill (description clarity, token cost, keyword coverage)
- Save edits write back to the SKILL.md file
- Tests pass (.venv/bin/pytest tests/ -v)
- Lint clean (.venv/bin/ruff check . && .venv/bin/ruff format --check .)
