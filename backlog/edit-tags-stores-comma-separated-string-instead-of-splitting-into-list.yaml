description: "When invoking 'agile-backlog edit ITEM_ID --tags \"a,b,c\"', the tags\
  \ field in the YAML stores a list with one entry containing the literal string 'a,b,c'\
  \ instead of three separate list entries. Discovered 2026-04-15 during /sprint-start\
  \ 12 in the data_classifier project \u2014 the rescoped sprint12-shadow-directive-promotion-gate\
  \ item had tags: ['sprint12,meta-classifier,directive-promotion,family-metric,critical-path']\
  \ in the resulting YAML. Expected: tags should split on comma into a proper YAML\
  \ list. Fix scope: likely a one-line .split(',') in the click handler for --tags,\
  \ plus a regression test. Workaround: edit the YAML directly."
