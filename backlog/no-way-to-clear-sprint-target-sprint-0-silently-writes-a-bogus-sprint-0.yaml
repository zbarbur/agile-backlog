description: "Hit on tracksupp.ai 2026-07-23. After closing two items that had been\
  \ wrongly tagged into an upcoming sprint, there was no way to remove the tag: 'edit\
  \ --sprint' takes an integer and offers no unset. 'edit <id> --sprint 0' is accepted\
  \ silently and writes 'sprint_target: 0' \u2014 a sprint that does not exist, which\
  \ then appears in sprint filters and groupings. Either accept an explicit clearing\
  \ value (--sprint none / --no-sprint) or reject 0 as invalid. Workaround used: retag\
  \ each item to the sprint in which its work actually shipped, which was more accurate\
  \ anyway \u2014 but that only worked because the history was known."
