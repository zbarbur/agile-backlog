description: "Raised adopting validate-command.sh on tracksupp.ai 2026-07-23. The\
  \ script's only instruction is a comment: 'CUSTOMIZE: Add patterns matching your\
  \ project's skill domains', with defaults (gcloud|bq |kubectl|docker compose|docker\
  \ build|terraform|deploy|migrate|rollback). Adopting this well is genuinely hard\
  \ and nothing explains how. THE TRAP: the deny is unconditional and stateless \u2014\
  \ a matched command is blocked every time, with no way for the agent to signal 'I\
  \ read the skill, now run it'. So the pattern you most want to add is the one that\
  \ destroys your setup. On this project the command whose flags actually get guessed\
  \ is 'agile-backlog' \u2014 that is precisely why a cli-reference skill exists for\
  \ it. Add it to SKILL_PATTERNS and every sprint skill that shells out to agile-backlog\
  \ breaks permanently. The patterns that are SAFE to add turn out to be the ones\
  \ you rarely run (deploy, migrate, rollback), which is also the low-value end. Nothing\
  \ in the docs says this. SECOND ISSUE: SAFE_PATTERNS is evaluated first and anchored\
  \ at ^, so any compound command that merely STARTS with a safe verb bypasses the\
  \ block entirely \u2014 'cat notes.txt && gcloud ...' is allowed, because it starts\
  \ with cat. The gate is trivially and probably accidentally circumvented. ASKS:\
  \ (1) document selection criteria \u2014 a pattern belongs here when the command\
  \ is rare, consequential, and has a skill documenting its correct form; it does\
  \ NOT belong when it is a high-frequency tool invocation, however skill-covered;\
  \ (2) give a worked example per project shape rather than a cloud-ops default set\
  \ that suits few adopters; (3) add an escape mechanism so a skill-covered command\
  \ can be run after the skill is consulted, otherwise the hook can only ever be a\
  \ wall; (4) match SAFE_PATTERNS against the whole command, not just its first token."
