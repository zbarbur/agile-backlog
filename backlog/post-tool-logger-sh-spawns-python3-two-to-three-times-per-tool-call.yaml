description: "Noted installing the logger on tracksupp.ai 2026-07-23. Registered across\
  \ Read/Grep/Glob/Bash/WebFetch/Agent/Edit/Write/Skill, it runs on essentially every\
  \ tool call, and each run spawns python3 once to extract the tool name, once to\
  \ build the log entry, and a third time on Read to pull file_path for re-read detection.\
  \ On a read-heavy session that is a per-tool-call interpreter start multiplied by\
  \ hundreds. Worth collapsing into a single python3 invocation that does all three\
  \ jobs, or rewriting the extraction in pure bash given the inputs are small and\
  \ known. Not urgent \u2014 it works and exits 0 \u2014 but it is a fixed tax on\
  \ every session in every adopting project."
