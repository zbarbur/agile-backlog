goal: Make 'serve' work on a default install, and when NiceGUI is genuinely missing,
  print the remedy that matches the user's actual install method.
complexity: S
technical_specs:
- 'DECIDED 2026-07-23 (was FLAGGED): do BOTH. (a) Promote nicegui from [project.optional-dependencies].ui
  into base [dependencies] in pyproject.toml so serve works on every default install;
  keep the [ui] extra defined as an alias so existing ''agile-backlog[ui]'' installs
  do not break. (b) Still fix the error message as a safety net for stripped/broken
  environments.'
- "src/agile_backlog/cli.py:660 \u2014 replace the hardcoded 'pip install agile-backlog[ui]'\
  \ SystemExit with install-context detection: uv tool receipt (~/.local/share/uv/tools/agile-backlog/uv-receipt.toml),\
  \ pipx metadata, plain pip/venv. Print the matching command; when inconclusive print\
  \ BOTH pip and uv. Keep detection in a small pure helper so it is testable without\
  \ a real install."
- "tests/test_cli.py \u2014 cover remedy selection per detected context using a stubbed\
  \ home/root path."
description: "Hit on tracksupp.ai 2026-07-23 (v0.30.0) on first attempt to use the\
  \ UI for sprint planning. 'agile-backlog serve' exits 1 with: 'Error: NiceGUI is\
  \ not installed. Install with: pip install agile-backlog[ui]'. Two problems. (1)\
  \ The remediation is wrong for the install path the docs recommend: the tool is\
  \ installed as an isolated uv tool (uv tool install --editable), so 'pip install\
  \ agile-backlog[ui]' either targets the wrong environment or no-ops \u2014 the user's\
  \ serve stays broken and there is no hint why. What actually worked: uv tool install\
  \ --force --editable <repo> --with nicegui. (2) More basic: serve is a documented\
  \ first-class command and a headline feature, but it is dead on a default install.\
  \ Options: fold nicegui into the base dependencies; or detect the install context\
  \ (uv tool receipt at ~/.local/share/uv/tools/<name>/uv-receipt.toml vs pip vs pipx)\
  \ and print the matching command; or have serve offer to install the extra itself.\
  \ At minimum print BOTH the pip and uv commands rather than only the one that does\
  \ not apply."
acceptance_criteria:
- '''agile-backlog serve'' starts the UI on a default install with no extras step.'
- Installing 'agile-backlog[ui]' still resolves (the extra remains defined, no breakage
  for existing users).
- When NiceGUI is missing anyway, the error names a command that works for the detected
  install method.
- When the install context cannot be determined, the message lists both the pip and
  the uv command, never only pip.
- Tests pass (.venv/bin/pytest tests/ -v) and lint is clean (.venv/bin/ruff check
  . && .venv/bin/ruff format --check .)
test_plan:
- 'tests/test_cli.py: uv-tool context (stub receipt present) -> message contains the
  uv command, not a bare pip command'
- 'tests/test_cli.py: unknown context -> message contains both pip and uv commands'
